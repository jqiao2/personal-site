<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1c0d0e; font-family: "Archivo", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: #d9b45a; }
  a:hover { color: #f0d488; }
</style>
</helmet>

<div style="min-height:100vh; background:#1c0d0e; display:flex; justify-content:center; padding:0 24px 90px;">
  <div style="width:100%; max-width:760px;">

    <!-- Top bar -->
    <header style="display:flex; align-items:center; justify-content:space-between; padding:26px 0 22px; border-bottom:1px solid #4a2529; margin-bottom:40px;">
      <a href="{{ backHref }}" onClick="{{ handleBackClick }}" style="display:flex; align-items:center; gap:9px; font-size:13px; color:#a2857a;" style-hover="color:#f4e8d1;">
        <span style="font-size:15px;">&larr;</span><span>{{ backLabel }}</span>
      </a>
      <span style="font-size:11.5px; text-transform:uppercase; letter-spacing:2px; color:#8a6f63;">Diary entry</span>
    </header>

    <!-- Entry: poster sidebar + details -->
    <div style="display:grid; grid-template-columns:150px 1fr; gap:34px; align-items:start;">
      <!-- poster sidebar -->
      <div style="display:flex; flex-direction:column; gap:16px;">
        <a href="Film.dc.html" style="display:block; aspect-ratio:2/3; border-radius:7px; overflow:hidden; background-image:repeating-linear-gradient(135deg,#351a1d 0 9px,#2c1518 9px 18px); border:1px solid #4a2529; box-shadow:0 20px 40px -14px rgba(0,0,0,.55);" style-hover="border-color:#d9b45a;">
          <div style="width:100%; height:100%; display:flex; align-items:flex-end; padding:12px;">
            <div style="font-family:'Newsreader',serif; font-size:15px; color:#f2e5cd; line-height:1.2;">{{ title }} <span style="color:#b0917f; font-style:italic; font-size:13px;">{{ year }}</span></div>
          </div>
        </a>

        <!-- how I watched -->
        <div style="background:#2a1214; border:1px solid #4a2529; border-radius:10px; padding:15px 15px 16px;">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:#8a6f63; margin-bottom:12px;">Medium</div>
          <a href="{{ mediumHref }}" style="font-family:'Newsreader',serif; font-size:19px; color:#f4e8d1; line-height:1.1;" style-hover="color:#f0d488;">{{ mediumLabel }}</a>
          <sc-if value="{{ inTheater }}" hint-placeholder-val="{{ true }}">
            <div style="margin-top:12px; padding-top:12px; border-top:1px solid #402226; display:flex; flex-direction:column; gap:12px;">
              <sc-if value="{{ hasVenue }}" hint-placeholder-val="{{ true }}">
                <div>
                  <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#8a6f63; margin-bottom:3px;">Venue</div>
                  <a href="{{ venueHref }}" style="font-size:13px; color:#e9d9c4; line-height:1.35;" style-hover="color:#f0d488;">{{ venue }}</a>
                </div>
              </sc-if>
              <sc-if value="{{ hasFormat }}" hint-placeholder-val="{{ true }}">
                <div>
                  <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#8a6f63; margin-bottom:5px;">Format</div>
                  <a href="{{ formatHref }}" style="display:inline-block; font-size:11px; font-weight:700; letter-spacing:.5px; color:#ddc9b4; border:1.5px solid #6b4a42; border-radius:3px; padding:2px 8px;" style-hover="color:#f0d488; border-color:#d9b45a;">{{ format }}</a>
                </div>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </div>

      <!-- details -->
      <div>
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">
          <div style="font-family:'Newsreader',serif; font-style:italic; font-size:15px; color:#c2a99a; margin-bottom:6px;">Watched {{ watchedDate }}</div>
          <button onClick="{{ openEditor }}" style="flex:none; font-size:12px; font-weight:600; color:#ddc9b4; background:transparent; border:1px solid #4a2529; border-radius:7px; padding:7px 14px; cursor:pointer; font-family:'Archivo',sans-serif;" style-hover="border-color:#d9b45a; color:#f4e8d1;">Edit entry</button>
        </div>
        <a href="Film.dc.html" style="color:inherit;" style-hover="color:#f0d488;">
          <h1 style="font-family:'Newsreader',serif; font-weight:500; font-size:40px; color:#f4e8d1; letter-spacing:-.5px; line-height:1.04;">{{ title }} <span style="color:#a2857a; font-style:italic; font-weight:400; font-size:28px;">{{ year }}</span></h1>
        </a>
        <div style="font-size:14px; color:#c2a99a; margin-top:8px;">Directed by <a href="{{ directorHref }}" style="color:#f2e5cd; font-weight:600;" style-hover="color:#f0d488;">{{ director }}</a></div>

        <!-- rating + flags -->
        <div style="display:flex; align-items:center; gap:16px; margin-top:18px; flex-wrap:wrap;">
          <span style="color:#d9b45a; font-size:20px; letter-spacing:2px;">{{ stars }}</span>
          <sc-if value="{{ liked }}" hint-placeholder-val="{{ true }}">
            <span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#e9d9c4;"><span style="color:#d9b45a; font-size:15px;">&#9829;</span> Liked</span>
          </sc-if>
          <sc-if value="{{ rewatch }}" hint-placeholder-val="{{ true }}">
            <span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#e9d9c4;"><span style="color:#d9b45a; font-size:15px;">&#8635;</span> Rewatch</span>
          </sc-if>
        </div>

        <!-- review -->
        <div style="margin-top:24px;">
          <div style="font-family:'Newsreader',serif; font-style:italic; font-size:18px; color:#ecdcbd; padding-bottom:10px; border-bottom:1px solid #402226; margin-bottom:16px;">Review</div>
          <p style="font-family:'Newsreader',serif; font-size:18px; color:#e6d8c3; line-height:1.7;">{{ review }}</p>
        </div>

        <!-- tags under review -->
        <sc-if value="{{ hasTags }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:22px;">
            <sc-for list="{{ tagLinks }}" as="t" hint-placeholder-count="4">
              <a href="{{ t.href }}" style="font-size:12px; color:#ddc9b4; border:1px solid #4a2529; border-radius:20px; padding:5px 13px; background:#241012;" style-hover="color:#f0d488; border-color:#d9b45a;">{{ t.label }}</a>
            </sc-for>
          </div>
        </sc-if>

        <!-- watched with -->
        <sc-if value="{{ hasFriends }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top:20px; font-size:13px; color:#a2857a; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">Watched with <sc-for list="{{ friendLinks }}" as="fr" hint-placeholder-count="2"><a href="{{ fr.href }}" style="color:#e9d9c4;" style-hover="color:#f0d488;">{{ fr.sep }}</a></sc-for></div>
        </sc-if>
      </div>
    </div>

  </div>

  <dc-import name="Entry Editor" film-href="Film.dc.html" mode="edit" open="{{ editorOpen }}" film-title="{{ eFilmTitle }}" film-year="{{ eFilmYear }}" seed-date="{{ seedDate }}" seed-rating="{{ seedRating }}" seed-liked="{{ seedLiked }}" seed-rewatch="{{ seedRewatch }}" seed-medium="{{ seedMedium }}" seed-venue="{{ seedVenue }}" seed-format="{{ seedFormat }}" seed-other-medium="{{ seedOtherMedium }}" seed-review="{{ seedReview }}" seed-tags="{{ seedTags }}" seed-friends="{{ seedFriends }}" on-save="{{ onSave }}" on-close="{{ onClose }}" on-delete="{{ onDelete }}" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  storeKey = "filmlog:v2:Perfect Days:2023";
  componentDidMount() {
    import("./nav-back.js").then((m) => {
      this._nav = m;
      const i = this.entryIndex();
      if (i != null) {
        const store = m.loadStore(this.storeKey, null);
        const rev = store && store[i];
        if (rev) { this.setState({ entry: this.reviewToEntry(rev) }); return; }
      }
      this.forceUpdate();
    });
  }
  entryIndex() {
    const raw = new URLSearchParams(location.search).get("i");
    if (raw == null || raw === "") return null;
    const n = parseInt(raw, 10);
    return Number.isNaN(n) ? null : n;
  }
  reviewToEntry(r) {
    return {
      medium: r.medium, venue: r.venue, format: r.format, otherMedium: r.otherMedium,
      date: r.dateIso, rating: r.rating, liked: r.liked, rewatch: r.rewatch,
      review: r.text, tags: r.tags, friends: r.friends,
    };
  }
  persist(entry) {
    const i = this.entryIndex();
    if (i == null || !this._nav) return;
    const store = this._nav.loadStore(this.storeKey, null);
    if (!store || !store[i]) return;
    store[i] = {
      rating: entry.rating, liked: entry.liked, rewatch: entry.rewatch, dateIso: entry.date,
      medium: entry.medium, venue: entry.venue, format: entry.format, otherMedium: entry.otherMedium,
      tags: entry.tags, friends: entry.friends, text: entry.review,
    };
    this._nav.saveStore(this.storeKey, store);
  }
  backNav(fallbackHref, fallbackLabel) {
    const nav = this._nav ? this._nav.resolveBack(fallbackHref, fallbackLabel) : { href: fallbackHref, label: fallbackLabel };
    return { backHref: nav.href, backLabel: nav.label, handleBackClick: this._nav ? this._nav.handleBack : (e) => { e.preventDefault(); location.href = fallbackHref; } };
  }
  entryDefaults() {
    return {
      medium: "theater",
      venue: "Metrograph, NYC",
      format: "35mm",
      otherMedium: "",
      date: "2026-07-08",
      rating: 4.5,
      liked: true,
      rewatch: false,
      review:
        "Wenders finds the whole world in a Tokyo cleaning route. The komorebi \u2014 sunlight through leaves \u2014 becomes a whole philosophy. Quietly devastating, and the closing shot on Yakusho's face is one of the best of the decade.",
      tags: ["komorebi", "slow cinema", "Tokyo", "rewatchable"],
      friends: ["Mia Tanaka", "Leo Vasquez"],
    };
  }

  state = { editorOpen: false, entry: null };

  constructor(...a) {
    super(...a);
    this.state.entry = this.entryDefaults();
  }

  starText(r) {
    const full = Math.floor(r);
    return "\u2605".repeat(full) + (r % 1 >= 0.5 ? "\u00bd" : "");
  }

  mediumMeta(m) {
    const map = {
      theater: { label: "Theater" },
      tv: { label: "TV" },
      computer: { label: "Computer" },
      plane: { label: "Airplane" },
      other: { label: "Other" },
    };
    return map[m] || map.tv;
  }

  fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

  filterHref(key, val) {
    const p = new URLSearchParams();
    p.set(key, val);
    return "Films Watched.dc.html?" + p.toString();
  }

  renderVals() {
    const s = this.state, e = s.entry;
    const meta = this.mediumMeta(e.medium);
    const inTheater = e.medium === "theater";
    const director = "Wim Wenders";
    const venueName = (e.venue || "").split(",")[0].trim();
    const friendLinks = e.friends.map((name, i) => ({
      sep: i < e.friends.length - 1 ? name + "," : name,
      href: this.filterHref("fFriends", name),
    }));
    return {
      directorHref: this.filterHref("fDirectors", director),
      mediumHref: this.filterHref("fMediums", meta.label),
      venueHref: this.filterHref("fVenues", venueName),
      formatHref: this.filterHref("fFormats", e.format),
      tagLinks: e.tags.map((t) => ({ label: t, href: this.filterHref("fTags", t) })),
      friendLinks,
      ...this.backNav("Film Diary.dc.html", "Film diary"),
      // page display
      title: "Perfect Days",
      year: 2023,
      director: "Wim Wenders",
      watchedDate: this.fmtDate(e.date),
      stars: this.starText(e.rating),
      liked: e.liked,
      rewatch: e.rewatch,
      review: e.review,
      tags: e.tags,
      hasTags: e.tags.length > 0,
      friendsLabel: e.friends.join(", "),
      hasFriends: e.friends.length > 0,
      mediumLabel: meta.label,
      inTheater,
      venue: e.venue,
      hasVenue: inTheater && !!e.venue,
      format: e.format,
      hasFormat: inTheater && !!e.format,

      // editor open + seeds
      editorOpen: s.editorOpen,
      openEditor: () => this.setState({ editorOpen: true }),
      eFilmTitle: "Perfect Days",
      eFilmYear: 2023,
      seedDate: e.date,
      seedRating: e.rating,
      seedLiked: e.liked,
      seedRewatch: e.rewatch,
      seedMedium: e.medium,
      seedVenue: e.venue,
      seedFormat: e.format,
      seedOtherMedium: e.otherMedium,
      seedReview: e.review,
      seedTags: e.tags,
      seedFriends: e.friends,

      // editor callbacks
      onSave: (entry) => {
        const next = {
          medium: entry.medium, venue: entry.venue, format: entry.format, otherMedium: entry.otherMedium,
          date: entry.date, rating: entry.rating, liked: entry.liked, rewatch: entry.rewatch,
          review: entry.review, tags: entry.tags, friends: entry.friends,
        };
        this.persist(next);
        this.setState({ entry: next, editorOpen: false });
      },
      onClose: () => this.setState({ editorOpen: false }),
      onDelete: () => { window.location.href = "Film Diary.dc.html"; },
    };
  }
}
</script>
</body>
</html>
