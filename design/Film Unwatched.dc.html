<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1c0d0e; font-family: "Archivo", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: #d9b45a; }
  a:hover { color: #f0d488; }
</style>
</helmet>

<div style="min-height:100vh; background:#1c0d0e;">

  <!-- Backdrop -->
  <div style="position:relative; height:360px; background-image:repeating-linear-gradient(135deg,#3a1c20 0 14px,#2c1518 14px 28px); overflow:hidden;">
    <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(28,13,14,.35) 0%, rgba(28,13,14,.72) 55%, #1c0d0e 100%);"></div>
    <div style="position:absolute; top:0; left:0; right:0; display:flex; justify-content:center;">
      <div style="width:100%; max-width:960px; padding:24px;">
        <a href="{{ backHref }}" onClick="{{ handleBackClick }}" style="display:inline-flex; align-items:center; gap:9px; font-size:13px; color:#e9d9c4;" style-hover="color:#fff;">
          <span style="font-size:15px;">&larr;</span><span>{{ backLabel }}</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div style="display:flex; justify-content:center; padding:0 24px 80px;">
    <div style="width:100%; max-width:960px; margin-top:-150px; position:relative; display:grid; grid-template-columns:230px 1fr; gap:36px; align-items:start;">

      <!-- Left: poster + actions -->
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div style="position:relative; aspect-ratio:2/3; border-radius:7px; overflow:hidden; background-image:repeating-linear-gradient(135deg,#351a1d 0 9px,#2c1518 9px 18px); border:1px solid #4a2529; box-shadow:0 20px 40px -12px rgba(0,0,0,.6); display:flex; align-items:flex-end; padding:14px;">
          <div style="position:absolute; top:12px; left:12px; font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:#e9d9c4; background:rgba(28,13,14,.72); border:1px solid #5d3036; border-radius:20px; padding:4px 10px;">Not seen</div>
          <div style="font-family:'Newsreader',serif; font-size:18px; color:#f2e5cd; line-height:1.2;">{{ title }} <span style="color:#b0917f; font-style:italic; font-size:15px;">{{ year }}</span></div>
        </div>

        <button onClick="{{ openComposer }}" style="width:100%; font-size:14px; font-weight:700; color:#2a1214; background:#d9b45a; border:none; border-radius:9px; padding:12px; cursor:pointer; font-family:'Archivo',sans-serif;" style-hover="background:#f0d488;">Log or review</button>

        <a href="{{ downloadUrl }}" style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; line-height:15px; font-size:13px; font-weight:600; border-radius:9px; padding:11px; border:1px solid #4a2529; color:#c2a99a; background:transparent;" style-hover="border-color:#d9b45a; color:#f4e8d1;">
          <span style="font-size:13px;">&darr;</span><span>Download</span>
        </a>

        <button onClick="{{ toggleWatchlist }}" style="{{ watchlistBtnStyle }}" style-hover="border-color:#d9b45a;">{{ watchlistLabel }}</button>
      </div>

      <!-- Right: details -->
      <div style="padding-top:150px;">
        <h1 style="font-family:'Newsreader',serif; font-weight:500; font-size:46px; color:#f4e8d1; letter-spacing:-.5px; line-height:1.02;">{{ title }} <span style="color:#a2857a; font-style:italic; font-weight:400; font-size:32px;">{{ year }}</span></h1>
        <div style="font-size:14px; color:#c2a99a; margin-top:10px;">Directed by <a href="{{ directorHref }}" style="color:#f2e5cd; font-weight:600;" style-hover="color:#f0d488;">{{ director }}</a></div>

        <div style="display:flex; gap:22px; align-items:center; margin-top:18px; flex-wrap:wrap;">
          <span style="font-size:11px; font-weight:700; letter-spacing:.5px; color:#ddc9b4; border:1.5px solid #6b4a42; border-radius:3px; padding:2px 7px; line-height:1.2;">{{ certification }}</span>
          <span style="font-size:12px; color:#8a6f63;">{{ releaseDate }}</span>
          <span style="font-size:12px; color:#8a6f63;">&middot;</span>
          <span style="font-size:12px; color:#8a6f63;">{{ runtime }}</span>
          <span style="font-size:12px; color:#8a6f63;">&middot;</span>
          <span style="font-size:12px; color:#8a6f63;">{{ country }}</span>
        </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:20px;">
          <sc-for list="{{ genres }}" as="g" hint-placeholder-count="3">
            <span style="font-size:12px; color:#ddc9b4; border:1px solid #4a2529; border-radius:20px; padding:5px 13px; background:#241012;">{{ g }}</span>
          </sc-for>
        </div>

        <p style="font-size:15px; color:#d8c6ad; line-height:1.65; margin-top:22px; max-width:560px;">{{ synopsis }}</p>

        <!-- Cast -->
        <div style="margin-top:28px;">
          <div style="font-family:'Newsreader',serif; font-style:italic; font-size:17px; color:#ecdcbd; padding-bottom:9px; border-bottom:1px solid #402226; margin-bottom:12px;">Cast</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <sc-for list="{{ castLinks }}" as="c" hint-placeholder-count="5">
              <a href="{{ c.href }}" style="font-size:13px; color:#e9d9c4; background:#241012; border:1px solid #4a2529; border-radius:6px; padding:7px 12px;" style-hover="color:#f0d488; border-color:#d9b45a;">{{ c.name }}</a>
            </sc-for>
          </div>
        </div>


        <!-- Similar films you've logged -->
        <div style="margin-top:28px;">
          <div style="font-family:'Newsreader',serif; font-style:italic; font-size:17px; color:#ecdcbd; padding-bottom:9px; border-bottom:1px solid #402226; margin-bottom:14px;">If you liked</div>
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; max-width:560px;">
            <sc-for list="{{ related }}" as="f" hint-placeholder-count="4">
              <a href="{{ f.href }}" style="display:flex; flex-direction:column; gap:7px;">
                <div style="aspect-ratio:2/3; border-radius:5px; background-image:repeating-linear-gradient(135deg,#351a1d 0 8px,#2c1518 8px 16px); border:1px solid #4a2529;"></div>
                <span style="font-size:11px; color:#c2a99a; line-height:1.3;">{{ f.title }}</span>
              </a>
            </sc-for>
          </div>
        </div>
      </div>

    </div>
  </div>

  <dc-import name="Entry Editor" film-href="Film Unwatched.dc.html" mode="log" open="{{ editorOpen }}" film-title="{{ title }}" film-year="{{ year }}" seed-date="{{ seedDate }}" seed-rating="{{ seedRating }}" seed-liked="{{ seedLiked }}" seed-rewatch="{{ seedRewatch }}" seed-medium="{{ seedMedium }}" seed-venue="{{ seedVenue }}" seed-format="{{ seedFormat }}" seed-other-medium="{{ seedOtherMedium }}" seed-review="{{ seedReview }}" seed-tags="{{ seedTags }}" seed-friends="{{ seedFriends }}" on-save="{{ onEditorSave }}" on-close="{{ onEditorClose }}" hint-size="0px,0px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#d9b45a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#d9b45a&quot;,&quot;#c98a5b&quot;,&quot;#9fb08a&quot;]},&quot;downloadUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { editorOpen: false, onList: true, logged: false };

  componentDidMount() {
    import("./nav-back.js").then((m) => { this._nav = m; this.forceUpdate(); });
  }
  backNav(h, l) {
    const nav = this._nav ? this._nav.resolveBack(h, l) : { href: h, label: l };
    return { backHref: nav.href, backLabel: nav.label, handleBackClick: this._nav ? this._nav.handleBack : (e) => { e.preventDefault(); location.href = h; } };
  }

  renderVals() {
    const s = this.state;
    const filterHref = (k, v) => "Films Watched.dc.html?" + new URLSearchParams({ [k]: v }).toString();
    const cast = ["Bruno Ganz", "Solveig Dommartin", "Otto Sander", "Curt Bois", "Peter Falk"];

    return {
      ...this.backNav("Watchlist.dc.html", "Watchlist"),
      title: "Wings of Desire",
      year: 1987,
      director: "Wim Wenders",
      directorHref: filterHref("fDirectors", "Wim Wenders"),
      certification: "PG-13",
      releaseDate: "May 17, 1987",
      runtime: "2h 8m",
      country: "West Germany",
      genres: ["Drama", "Romance", "Fantasy"],
      synopsis:
        "Two angels drift over a divided Berlin, listening in on the private thoughts of its citizens. When one of them falls for a trapeze artist, he begins to long for the weight and warmth of a mortal life \u2014 coffee, cold hands, the taste of blood.",
      castLinks: cast.map((c) => ({ name: c, href: filterHref("fActors", c) })),

      downloadUrl: this.props.downloadUrl ?? "#",
      onList: s.onList,
      watchlistLabel: s.onList ? "\u2713 On watchlist" : "+ Add to watchlist",
      watchlistBtnStyle:
        "width:100%; display:flex; align-items:center; justify-content:center; gap:8px; line-height:15px; font-size:13px; font-weight:600; border-radius:9px; padding:11px; cursor:pointer; font-family:'Archivo',sans-serif; background:transparent; border:1px solid " +
        (s.onList ? "#4a2529" : "#5d3036") + "; color:" + (s.onList ? "#c2a99a" : "#e9d9c4") + ";",
      toggleWatchlist: () => this.setState((p) => ({ onList: !p.onList })),

      related: [
        { title: "Perfect Days", href: "Film v2.dc.html" },
        { title: "Paris, Texas", href: "Film.dc.html" },
        { title: "Drive My Car", href: "Film.dc.html" },
        { title: "Cl\u00e9o from 5 to 7", href: "Film.dc.html" },
      ],

      openComposer: () => this.setState({ editorOpen: true }),
      editorOpen: s.editorOpen,
      seedDate: "2026-08-01",
      seedRating: 0,
      seedLiked: false,
      seedRewatch: false,
      seedMedium: "theater",
      seedVenue: "",
      seedFormat: "",
      seedOtherMedium: "",
      seedReview: "",
      seedTags: [],
      seedFriends: [],
      onEditorSave: () => this.setState({ editorOpen: false, logged: true }),
      onEditorClose: () => this.setState({ editorOpen: false }),
    };
  }
}

</script>
</body>
</html>
