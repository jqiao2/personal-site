<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- The site mark: `jq` — the initials, and the JSON processor. A warm-accent
         tile with the monogram knocked out, legible down to 16px. The accent is
         the spine's #8c4a2f; it reads on both light and dark tabs unchanged. -->
    <rect width="128" height="128" rx="28" fill="#8c4a2f" />
    <text x="50%" y="70%" text-anchor="middle" fill="#f4f1ea"
        font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace"
        font-size="78" font-weight="700" letter-spacing="-4">jq</text>
</svg>
